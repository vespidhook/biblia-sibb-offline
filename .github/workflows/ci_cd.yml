name: CI/CD for Bíblia SIBB

on:
  push:
    branches:
      - master

jobs:
  CI:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Generate expo-env.d.ts
        run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts

      - name: Typecheck
        run: npx tsc --noEmit

  CD:
    name: Continuous Delivery
    runs-on: ubuntu-latest
    needs: CI
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EAS_EXPO_TOKEN_SIBB }}

      - name: Decode Google Play service account
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_64: ${{ secrets.EAS_GOOGLE_PLAY_API }}
        run: |
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_64" | base64 -d > google-play-service-account.json

      - name: Build and submit to internal testing
        run: |
          eas build --platform android --profile production --non-interactive --auto-submit --no-wait
